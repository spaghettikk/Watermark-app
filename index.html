<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Filmmy Watermark Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Kanit:wght@400;600&family=Prompt:wght@400;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <style>
    canvas { touch-action: none; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans min-h-screen pb-10 transition-colors">

  <header class="bg-blue-600 dark:bg-gray-800 text-white p-3 md:px-8 sticky top-0 z-50 shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-base md:text-xl font-bold leading-tight">Filmmy Watermark Editor</h1>
      <p class="text-[10px] md:text-xs text-blue-200 dark:text-gray-400 font-normal">By FilmmyE22NCB</p>
    </div>
    
    <button id="themeToggleBtn" class="p-1.5 md:px-3 md:py-2 bg-blue-700 dark:bg-gray-700 rounded-lg text-xs md:text-sm font-medium hover:opacity-90">
      🌙 / ☀️
    </button>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

    <section class="bg-white dark:bg-gray-800 p-4 md:p-6 rounded-xl shadow transition-colors">
      <h2 class="text-lg md:text-xl font-semibold mb-3 flex items-center justify-between">
        <span>1. จัดการคลังโลโก้</span>
        <label class="text-sm bg-blue-50 dark:bg-blue-900/50 text-blue-600 dark:text-blue-300 font-normal px-3 py-1.5 rounded border border-blue-200 dark:border-blue-700 cursor-pointer hover:bg-blue-100">
          + เพิ่มโลโก้
          <input type="file" id="logoInput" accept="image/*" multiple class="hidden">
        </label>
      </h2>
      <div id="logoGallery" class="flex gap-2 overflow-x-auto py-2 min-h-[64px] border border-dashed dark:border-gray-700 rounded p-2">
        <span class="text-xs text-gray-400 m-auto" id="noLogoText">ยังไม่มีโลโก้ในระบบ</span>
      </div>
    </section>

    <section class="bg-white dark:bg-gray-800 p-4 md:p-6 rounded-xl shadow transition-colors">
      <h2 class="text-lg md:text-xl font-semibold mb-2">2. อัปโหลดรูปภาพ (สูงสุด 30 รูป)</h2>
      <input type="file" id="photoInput" accept="image/*" multiple class="hidden">
      <button onclick="document.getElementById('photoInput').click()" class="w-full py-6 bg-blue-50 dark:bg-gray-700/50 border-2 border-dashed border-blue-300 dark:border-gray-600 rounded-xl text-blue-600 dark:text-gray-200 font-medium hover:bg-blue-100 flex flex-col items-center justify-center gap-1 transition-all">
        <span class="text-2xl">📷</span>
        <span class="text-sm font-bold">เลือกรูปภาพ (<span id="photoCount">0</span>/30)</span>
      </button>

      <div id="uploadStatus" class="hidden mt-2 p-2 text-center text-xs rounded bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300">
        กำลังประมวลผลรูปภาพ...
      </div>

      <div id="photoThumbnails" class="flex gap-2 overflow-x-auto mt-3 min-h-[52px]"></div>
    </section>

    <section class="bg-white dark:bg-gray-800 p-4 md:p-6 rounded-xl shadow relative transition-colors">
      <h2 class="text-lg md:text-xl font-semibold mb-4">3. ปรับแต่งภาพและจัดวางโลโก้</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
        <div class="space-y-2">
          <div class="relative w-full aspect-square bg-gray-200 dark:bg-gray-900 rounded-xl overflow-hidden flex items-center justify-center border dark:border-gray-700 shadow-inner">
            <canvas id="mainCanvas" class="max-w-full max-h-full"></canvas>
          </div>
          <p class="text-xs text-gray-500 dark:text-gray-400 text-center">ใช้นิ้วหรือเมาส์ลากเพื่อจัดตำแหน่งโลโก้หรือข้อความบนภาพได้เลย</p>
        </div>

        <div class="space-y-4">
          <div class="p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg space-y-3">
            <div class="flex justify-between items-center">
              <span class="text-sm font-semibold">โลโก้บนภาพ (<span id="placedLogoCount">0</span>)</span>
              <button id="addLogoToCanvasBtn" class="text
